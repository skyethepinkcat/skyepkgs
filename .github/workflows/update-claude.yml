name: Update claude

on:
  schedule:
    - cron: "0 */12 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Attic cache
        uses: ryanccn/attic-action@v0
        with:
          endpoint: "https://nix-cache.skyenet.online"
          cache: "skyenet"
          token: ${{ secrets.ATTIC_AUTH_TOKEN }}

      - name: Run update script
        run: nix shell nixpkgs#nix-update -c ./update.sh claude --impure
        env:
          NIXPKGS_ALLOW_UNFREE: "1"

      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(pkgs): update claude"
          branch: auto/update-claude
          delete-branch: true
          title: "chore(pkgs): update claude"
          body: |
            Automated weekly update via `./update.sh claude`.
