name: Update gemset.nix

on:
  push:
    branches: [main]
    paths:
      - "**/Gemfile"
      - "**/Gemfile.lock"

permissions:
  contents: write

jobs:
  update-gemset:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: skyethepinkcat
          # If you chose API tokens for write access OR if you have a private cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Find changed package directories
        id: changed
        run: |
          mapfile -t dirs < <(
            git diff --name-only HEAD~1 HEAD \
              | grep -E '(^|/)Gemfile(\.lock)?$' \
              | xargs -r dirname \
              | sort -u
          )
          printf '%s\n' "${dirs[@]}"
          echo "dirs=${dirs[*]}" >> "$GITHUB_OUTPUT"

      - name: Regenerate gemset.nix
        if: steps.changed.outputs.dirs != ''
        run: |
          for dir in ${{ steps.changed.outputs.dirs }}; do
            if [[ -f "$dir/Gemfile.lock" ]]; then
              echo "--- $dir ---"
              (cd "$dir" && nix run nixpkgs#bundix -- -l)
            fi
          done

      - name: Format gemset.nix
        if: steps.changed.outputs.dirs != ''
        run: |
          for dir in ${{ steps.changed.outputs.dirs }}; do
            if [[ -f "$dir/gemset.nix" ]]; then
              nix run nixpkgs#nixfmt-rfc-style -- "$dir/gemset.nix"
            fi
          done

      - name: Commit updated gemset.nix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '**/gemset.nix'
          if git diff --cached --quiet; then
            echo "gemset.nix unchanged"
          else
            git commit -m "chore(gemset): regenerate gemset.nix"
            git push
          fi
