name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Evaluate derivations (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Evaluate all package derivations
        run: nix flake check --no-build

      - name: Check formatting
        run: |
          nix run .#formatter -- --check $(git ls-files '*.nix')
