name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Evaluate derivations (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Attic cache
        uses: ryanccn/attic-action@v0
        with:
          endpoint: "https://nix-cache.skyenet.online"
          cache: "skyenet"
          token: ${{ secrets.ATTIC_AUTH_TOKEN }}

      - name: Evaluate all package derivations
        run: nix run nixpkgs#nix-fast-build -- --skip-cached --attic-cache skyenet --impure
        env:
          NIXPKGS_ALLOW_UNFREE: "1"

      - name: Check formatting
        run: |
          nix fmt
